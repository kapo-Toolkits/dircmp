[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dircmp"
version = "0.1.0"
description = "Deep, read-only comparison of two or more directories (CLI + Qt GUI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
dircmp = "dircmp.cli:main"

[project.gui-scripts]
dircmp-gui = "dircmp.gui.app:main"

[tool.setuptools.packages.find]
include = ["dircmp*"]

[tool.setuptools.package-data]
"dircmp.gui" = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
